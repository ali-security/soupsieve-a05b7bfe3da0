name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest selector to run a subset of tests'
        required: false
        default: ''

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-latest, windows-latest]
        tox-env: [py39, py310, py311, py312, py313, py314, nolxml, nohtml5lib]
        include:
          - tox-env: py39
            python-version: 3.9
            continue-on-error: false
          - tox-env: py310
            python-version: '3.10'
            continue-on-error: false
          - tox-env: py311
            python-version: '3.11'
            continue-on-error: false
          - tox-env: py312
            python-version: '3.12'
            continue-on-error: false
          - tox-env: py313
            python-version: '3.13'
            continue-on-error: false
          - tox-env: py314
            python-version: '3.14'
            continue-on-error: false
          - tox-env: nolxml
            python-version: '3.13'
            continue-on-error: false
          - tox-env: nohtml5lib
            python-version: '3.13'
            continue-on-error: false
        exclude:
          - platform: windows-latest
            tox-env: py314

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Test
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          python -m tox exec -- pytest ${{ inputs.test-filter }}
        else
          python -m tox
        fi

  lint:
    if: false
    timeout-minutes: 15
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.13]

    env:
      TOXENV: lint

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools tox
    - name: Lint
      run: |
        python -m tox

  documents:
    if: false
    timeout-minutes: 15
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.13]

    env:
      TOXENV: documents

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools tox
    - name: Install Aspell
      run: |
        sudo apt-get install aspell aspell-en
    - name: Build documents
      run: |
        python -m tox
